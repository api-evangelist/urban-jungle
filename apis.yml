name: Urban Jungle
kind: company
description: >-
  Urban Jungle Services Ltd is a London-based direct-to-consumer insurtech,
  founded in 2016 by Jimmy Williams and Greg Smyth to sell home insurance to
  "Generation Rent" — renters, sharers and students the traditional UK market
  underserves. It is an FCA-authorised intermediary (FRN 782061, company number
  10414152, England and Wales) and a certified B Corp, selling contents,
  buildings and contents, students contents, tenants liability, landlord, home
  emergency and public liability cover through its own digital journey at
  myurbanjungle.com, and claiming over 100,000 customers. Its API posture is
  partner-gated and undocumented in public. Urban Jungle announced a partnership
  programme and quote API in 2018, positioned so lettings agents, PropTech
  firms, institutional landlords and eCommerce sites can serve Urban Jungle
  quotes inside their own apps without being directly FCA-regulated themselves,
  but there is no developer portal, no reference documentation, no machine-
  readable specification and no self-serve signup. The only route in is a
  partnerships email address on a marketing page. No ACORD, AL3 or NGDS
  reference appears anywhere on the company's site or in its front-end bundles.
