actions:
  openapiDirectoryCreated: false
  apisListed: 0
  reason: >-
    Nothing real was found to harvest. apis[] is intentionally empty because
    Urban Jungle publishes no documented API with a reference page, base URL or
    specification. The known partner quote API is recorded in common[] as a
    Partners property with its honest access model rather than fabricated into
    an apis[] entry.
